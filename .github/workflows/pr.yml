name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server-build:
    name: Server build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test
        working-directory: server
        run: ./gradlew build --console=plain

  client-check:
    name: Client type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        working-directory: client
        run: bun install

      - name: Type check
        working-directory: client
        run: bun run check

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [server-build, client-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Install Playwright browsers
        working-directory: client
        run: bunx playwright install --with-deps chromium

      - name: Start backend
        working-directory: server
        run: |
          ./gradlew bootRun --console=plain > /tmp/backend.log 2>&1 &
          echo "Waiting for backend..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/public/actuator/health >/dev/null 2>&1; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        working-directory: client
        run: |
          bun run dev > /tmp/frontend.log 2>&1 &
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start in time"
          cat /tmp/frontend.log
          exit 1

      - name: Run e2e tests
        working-directory: client
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
